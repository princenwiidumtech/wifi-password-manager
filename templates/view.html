<!DOCTYPE html>
<html>
<head>
    <title>Saved Wi-Fi</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <div class="navbar">
        <h2>Wi-Fi Manager</h2>

        <nav>
            <a href="/">Home</a>
            <a href="/save">Save</a>
            <a href="/view">View</a>
        </nav>
    </div>
</header>


<main class="container">

    <h1>Saved Wi-Fi</h1>

    <p class="subtitle">Your saved Wi-Fi networks</p>


    {% if wifi_list %}

        <div class="wifi-grid">

            {% for wifi in wifi_list %}

                <div class="wifi-card">

                    <h2>{{ wifi.ssid }}</h2>

                    <p>
                        <strong>ID:</strong> {{ wifi.id }}
                    </p>

                    <p>
    <strong>Password:</strong>

    <span class="password" data-password="{{ wifi.password }}">
        ••••••••••
    </span>

    <button
        type="button"
        class="show-password"
        onclick="togglePassword(this)">

        Show

    </button>
                    </p>

                </div>

            {% endfor %}

        </div>

    {% else %}

        <p>No Wi-Fi passwords saved yet.</p>

    {% endif %}


    <a href="/save" class="button">
        Save Another Wi-Fi
    </a>

</main>


<footer>
    Wi-Fi Password Manager
</footer>

</body>
</html>
